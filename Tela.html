<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
      }
      body {
        background: linear-gradient(to bottom right, #e0f2fe, #ffffff);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        max-width: 900px;
        width: 100%;
        background: #fff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      .left {
        background: linear-gradient(to bottom, #2563eb, #4f46e5);
        color: white;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .left h1 {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .left p {
        opacity: 0.9;
        font-size: 14px;
        margin-bottom: 30px;
      }
      .left ul {
        list-style: none;
        line-height: 1.8;
        font-size: 14px;
        opacity: 0.9;
      }
      .right {
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .right h2 {
        font-size: 26px;
        margin-bottom: 10px;
        text-align: center;
      }
      .right p {
        text-align: center;
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 30px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      label {
        font-size: 14px;
        color: #374151;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.2s;
      }
      input:focus {
        border-color: #6366f1;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
      }
      .actions a {
        color: #4f46e5;
        text-decoration: none;
      }
      .btn {
        width: 100%;
        padding: 12px;
        background-color: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .btn:hover {
        background-color: #4338ca;
      }
     
      .footer {
        margin-top: 20px;
        text-align: center;
        font-size: 12px;
        color: #6b7280;
      }
      @media (max-width: 500px) {
        .container {
          grid-template-columns: 1fr;
        }
        .left {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left">
        <h1>Translider</h1>
        <p>Gestão e transporte com confiança</p>
        <ul>
          <li>• PAINEL DE MOTORISTA</li>
          <li>• CONTROLE DE COMBUSTIVEL</li>
          <li>• RELATORIO GESTÃO</li>
        </ul>
      </div>

      <div class="right">
        <h2>Acesse sua conta</h2>
        <p>Login para administradores, operadores e motoristas</p>

        <form>
          <div>
            <label for="email"></label>
            <input type="text" id="email" name="email" placeholder="E-mail ou CPF/CNPJ" required />
          </div>

          <div>
            <label for="password"></label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
          </div>

          <div class="actions">
            <label><input type="checkbox" /> Lembrar-me</label>
            <a href="#">Esqueci a senha</a>
          </div>

          <button type="submit" class="btn">Entrar</button>
        </form>
            <div class="footer">
          Ao continuar, você concorda com os termos de uso e políticas da empresa.
        </div>
      </div>
    </div>
  </body>
</html>
